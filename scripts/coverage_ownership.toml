#
# Hand-maintained input to scripts/amd_coverage.py. Everything not listed here
# is classified automatically from the diff against the upstream release this
# fork is based on; this file records only what git cannot see.
#
# A `redirect_owned` or `unowned` path must exist and be tracked -- both make a
# claim about the measured surface, so the tool fails on a stale entry rather
# than skipping it. `excluded` is not checked that way: it exists to name
# generated artifacts, which a checkout that has never been built does not have.

# Files with a zero-line Python diff whose implementation is nonetheless ours:
# jit_env.FLASHINFER_CSRC_DIR resolves to flashinfer/csrc_rocm/ on HIP, so these
# wrappers load AMD kernels through an unmodified upstream source path. A
# diff-based classifier cannot see that, and scoring them as upstream would
# credit none of the sampling, quantization or cascade surface to us.
[[redirect_owned]]
path = "flashinfer/sampling.py"
reason = "wrapper over csrc_rocm/sampling.cu and renorm.cu"

[[redirect_owned]]
path = "flashinfer/quantization.py"
reason = "wrapper over csrc_rocm/quantization.cu"

[[redirect_owned]]
path = "flashinfer/jit/sampling.py"
reason = "builds csrc_rocm/{sampling,renorm,flashinfer_sampling_binding}.cu"

[[redirect_owned]]
path = "flashinfer/jit/quantization.py"
reason = "builds csrc_rocm/{quantization,flashinfer_quantization_binding}.cu"

[[redirect_owned]]
path = "flashinfer/jit/cascade.py"
reason = "builds csrc_rocm/{cascade,flashinfer_cascade_binding}.cu"

# Rulings that contradict what a heuristic would guess. Recorded so the answer
# is reviewed once rather than re-derived per run.
[[unowned]]
path = "flashinfer/logits_processor/__init__.py"
reason = "upstream, unmodified; the retired include list carried it only because tests import it"

[[unowned]]
path = "flashinfer/fp4_quantization.py"
reason = "basename collision only -- resolves to nv_internal/cpp/kernels/quantization.cu, not ours"

[[unowned]]
path = "flashinfer/fp8_quantization.py"
reason = "basename collision only -- resolves to nv_internal/cpp/kernels/quantization.cu, not ours"

# Measured by coverage because they sit under flashinfer/, but not source we own.
[[excluded]]
path = "flashinfer/_version.py"
reason = "generated by setuptools-scm and gitignored, so no diff ever names it"
