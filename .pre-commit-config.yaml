# To use:
#
#     pre-commit run -a
#
# Or:
#
#     pre-commit install  # (runs every time you commit in git)
#
# To update this file:
#
#     pre-commit autoupdate
#
# See https://github.com/pre-commit/pre-commit
# Note the pre-commit hooks shoule only be used for formatting, but not for linting.
# For linting consider using CI.

# The kernel_src */src trees are upstream kernel drops that are re-synced
# periodically (sm100/cutedsl_megamoe, sm90/pull_style_cutedsl_megakernel);
# excluded from all hooks so formatting/lint churn doesn't block syncs.
# The shim/ layers next to them are ours and stay checked.
exclude: ^flashinfer/moe_ep/kernel_src/(cutedsl_megamoe|sm90/pull_style_cutedsl_megakernel)/src/

repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  # Changes tabs to spaces
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: remove-tabs
      - id: remove-crlf

  # Formatters
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.1
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        exclude: ^3rdparty/.*

  -   repo: https://github.com/pre-commit/mirrors-mypy
      rev: 'v1.17.1'  # Use the sha / tag you want to point at
      hooks:
      -   id: mypy
          # --ignore-missing-imports: torch, jinja2, pynvml, packaging, and other
          # runtime deps are not installed in the pre-commit isolation environment
          # (ROCm torch ships from AMD's repo, not PyPI).  The hook still performs
          # structural type checking on code that can be analyzed.
          args: ["--config-file", "pyproject.toml", "--ignore-missing-imports", "--exclude", "flashinfer-cubin/"]
          files: ^flashinfer/
          exclude: ^(flashinfer-cubin/|flashinfer/attention/prims_ts/kernels/|3rdparty/|build/|flashinfer/cute_dsl/attention/fmha/(fmha\.py|fmha_blockscaled\.py|helpers/)|flashinfer/gemm/kernels/dense_blockscaled_gemm_sm107\.py|flashinfer/fused_moe/cute_dsl/rubin/(blockscaled_contiguous_gather_grouped_gemm_swiglu_fusion\.py|blockscaled_contiguous_grouped_gemm_finalize_fusion\.py))

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.12.8
    hooks:
      # Run the linter.
      - id: ruff-check
      # Run the formatter.
      - id: ruff-format
        types_or: [ python, pyi ]

  # Fork-owned markdown only. Upstream does not run markdownlint, so pointing it
  # at the whole tree rewrites documents the port does not own -- v0.6.18 brought
  # in 24 such files -- and every rewrite is a permanent merge conflict.
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: ["--fix"]
        files: |
          (?x)^(
            README\.md
            |CONTRIBUTING\.md
            |CLAUDE\.md
            |benchmarks/README\.md
            |docs/rocm/.*\.md
            |amd-flashinfer-jit-cache/README\.md
            |\.claude/skills/(add-rocm-kernel|benchmark-kernel|code-coverage
              |coding-guidelines|debug-rocm-crash|plan-review|pr-workflow)/SKILL\.md
          )$

  # REUSE compliance check for specific directories only
  - repo: local
    hooks:
      - id: reuse-selective
        name: reuse (selective files)
        entry: ./scripts/reuse-check-selective.sh
        language: system
        files: ^include/flashinfer/rocm/.*\.(cuh|hpp|h)$
        pass_filenames: true

  # The README's per-architecture support matrix is generated from
  # flashinfer/rocm/arch_caps.py. Catch a table edit that did not regenerate it here,
  # rather than after someone trusts the stale row. Imports no third-party
  # package, so it runs anywhere pre-commit does.
  - repo: local
    hooks:
      - id: arch-support-matrix
        name: README arch support matrix is current
        entry: python3 scripts/gen_arch_support_matrix.py --check
        language: system
        files: ^(flashinfer/rocm/arch_caps\.py|README\.md|scripts/gen_arch_support_matrix\.py)$
        pass_filenames: false
