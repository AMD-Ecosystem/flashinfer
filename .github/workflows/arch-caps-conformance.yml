# Hardware-less conformance check for the per-op/per-arch capability table.
#
# Every other ROCm test in this repo needs an MI300X/MI355X and a ROCm toolchain,
# so nothing in tests/rocm_tests/ runs on a pull request today. The capability
# table is the one piece that can: it is pure data plus routing logic, and its
# suite is written to load flashinfer/arch_caps.py and flashinfer/hip_utils.py
# directly rather than importing the package (flashinfer/__init__.py raises on a
# CPU-only torch build). pytest is the only dependency.
#
# What this protects: a row added for one architecture but not the other, a
# gate whose op name no longer matches any call site, a known-bad window that
# stops matching the version it was written for, or a module-scope `import torch`
# creeping into the pre-HIP_VISIBLE_DEVICES path. All of those are currently
# caught only by someone remembering to run the GPU suite.
name: arch-caps conformance

on:
  pull_request:
  push:
    branches: [amd-integration]

permissions: read-all

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # --noconftest: tests/conftest.py and tests/rocm_tests/conftest.py both
      # import torch and flashinfer at module scope, so collecting under
      # tests/rocm_tests/ would fail here long before this file is reached. The
      # suite defines its own fixtures and needs nothing from either conftest;
      # test_suite_loads_without_torch is what keeps that true.
      - name: Capability-table conformance (no GPU, no torch)
        run: pytest --noconftest tests/rocm_tests/test_arch_caps_hip.py

      # The other hardware-less suite: ownership classification for
      # scripts/amd_coverage.py. It builds throwaway git repositories and never
      # needs the upstream remote, so a shallow checkout is enough.
      - name: Coverage-ownership classification (no GPU, no torch)
        run: pytest --noconftest tests/rocm_tests/test_amd_coverage.py

      # The unit tests once stayed green while the tool itself raised on every
      # invocation, so CI has to actually invoke it. The base is the upstream
      # release this fork is tagged against, so only that one tag is needed --
      # no suite run, no GPU.
      - name: Coverage tool runs at all
        run: |
          git fetch --depth=1 --tags origin '+refs/tags/*+amd.*:refs/tags/*+amd.*'
          UPSTREAM=$(git describe --tags --abbrev=0 --match '*+amd.*' | cut -d+ -f1)
          echo "fork is based on upstream $UPSTREAM"
          git remote add upstream https://github.com/flashinfer-ai/flashinfer.git
          git fetch --depth=1 upstream tag "$UPSTREAM"
          python -c "
          import importlib.util, pathlib, sys
          spec = importlib.util.spec_from_file_location('ac', 'scripts/amd_coverage.py')
          ac = importlib.util.module_from_spec(spec); spec.loader.exec_module(ac)
          repo = ac._git(None, 'rev-parse', '--show-toplevel')
          base = ac._resolve_base(repo, None)
          owned, excluded, unowned, ruled = ac.classify(
              repo, base, ac._load_toml(pathlib.Path(repo) / ac._MANIFEST))
          print(f'{len(owned)} owned, {len(excluded)} excluded, {len(unowned)} unowned')
          sys.exit(0 if owned else 'classify() returned nothing')
          "
