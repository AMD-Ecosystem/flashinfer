name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4.2.2
    - uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'
    # Upstream's `Validate CUDA configuration` step is dropped. Its line-based
    # TOML reader cannot parse this file's multi-line `dev = [`, and past that it
    # requires CUDA extras (nvidia-cutlass-dsl[cu13]) a ROCm wheel cannot carry --
    # unsatisfiable here, not merely noisy. Same removal in release.yml.
    - uses: pre-commit/action@v3.0.1
