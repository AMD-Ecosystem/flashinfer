name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4.2.2
    - uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'
    # Upstream's `Validate CUDA configuration` step is dropped: it requires
    # pyproject.toml to declare CUDA extras (nvidia-cutlass-dsl[cu13]) that a
    # ROCm wheel cannot carry, so it is unsatisfiable here, not merely noisy.
    - uses: pre-commit/action@v3.0.1
