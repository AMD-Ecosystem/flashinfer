# Modified by Advanced Micro Devices, Inc. for the ROCm port (Apache-2.0 sec. 4(b)).
name: pre-commit

on:
  pull_request:
  push:
    branches: [amd-integration]

permissions:
  contents: read

# Pushes group by sha: a shared group would cancel a queued run on
# amd-integration and leave that commit without a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # The job id is the ruleset's required check context; do not rename it.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: '.python-version'
    # Upstream's `Validate CUDA configuration` step is dropped. Its line-based
    # TOML reader cannot parse this file's multi-line `dev = [`, and past that it
    # requires CUDA extras (nvidia-cutlass-dsl[cu13]) a ROCm wheel cannot carry --
    # unsatisfiable here, not merely noisy.
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
