[project]
name = "amd-flashinfer"
dynamic = ["version"]
description = "Fast Attention Algorithms for LLM Inference on ROCm"
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "Apache-2.0"
# Adding licenses/*.txt here makes `python -m build` write License-File
# metadata it does not copy, so the wheel contradicts its own METADATA.
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "AMD, Inc."}
]

# Runtime dependencies
# NOTE: torch is intentionally NOT listed here because ROCm users must install
# torch from AMD's ROCm repository, not from PyPI. For example,
#   pip install torch==2.9.1 -f https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2/
# See README.md for complete installation instructions.
dependencies = [
    "ninja",
    # Module-scope imports on the path `import flashinfer` always takes. Declared
    # explicitly because torch, the only other thing that pulls them in, is
    # deliberately left out above -- leaving the resolver no route to either.
    "filelock",
    "jinja2",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/rocm/flashinfer"
Repository = "https://github.com/rocm/flashinfer"
Documentation = "https://rocm.docs.amd.com/projects/install-on-linux/en/latest/install/3rd-party/flashinfer-install.html"
"Bug Tracker" = "https://github.com/rocm/flashinfer/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-xdist",
    "pytest-rerunfailures",
    # pytest-cov specifically, not bare `coverage run`: only the plugin measures
    # the xdist worker subprocesses that `pytest -n auto` spawns.
    "pytest-cov",
    # tests/rocm/test_build_backend.py parses pyproject.toml; tomllib is 3.11+.
    "tomli; python_version < '3.11'",
    "build",
]

[build-system]
# In-tree backend (see build_backend_rocm.py). Nothing is compiled at build time, so
# torch/numpy are not required; `wheel` is not either since setuptools 70.1, and
# listing it fails `python -m build --no-isolation` in docker/Dockerfile.rocm_ci.
requires = [
    "setuptools>=80",
    "setuptools-scm>=9.2",
    "packaging>=24"
]
build-backend = "build_backend_rocm"
backend-path = ["."]

[tool.setuptools.packages.find]
# Anchored, not "flashinfer*": that glob also matched the sibling
# flashinfer-cubin/ and flashinfer-jit-cache/ project roots and shipped them.
include = ["flashinfer", "flashinfer.*"]

[tool.setuptools.package-data]
# scikit-build-core's `wheel.packages = ["flashinfer"]` swept these in
# implicitly; setuptools requires them to be named. Both matter at runtime:
# get_csrc_dir() resolves flashinfer/csrc/rocm and get_include() resolves
# flashinfer/include, so dropping either ships a wheel whose JIT cannot compile.
# flashinfer/include itself is produced by build_backend_rocm.py, not by git.
flashinfer = [
    "py.typed",
    "csrc/rocm/**/*.cu",
    "csrc/rocm/**/*.cc",
    "csrc/rocm/**/*.h",
    "csrc/rocm/**/*.jinja",
    "include/**/*.cuh",
    "include/**/*.h",
    "include/**/*.hpp",
]

[tool.setuptools_scm]
write_to = "flashinfer/_version.py"
tag_regex = "^v?(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+(?:\\.post[0-9]+|(?:a|b|rc)[0-9]+|\\.dev[0-9]+)?)(?:[+](?P<local>[a-zA-Z0-9.]+))?$"
version_scheme = "no-guess-dev"
local_scheme = "dirty-tag"
scm.git.describe_command = ["python", "scripts/git_describe_rocm.py"]
fallback_version = "0.0.0"

[tool.codespell]
ignore-words-list = "3nd"
skip = [
    "build",
    "3rdparty",
    "dist",
    ".venv"
]


[tool.mypy]
ignore_missing_imports = false
show_column_numbers = true
show_error_context = true
follow_imports = "skip"
ignore_errors = false
strict_optional = false


[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    # "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    # "I",
]
ignore = [
    # Module level import not at top of file
    "E402",
    # star imports
    "F405", "F403",
    # ambiguous name
    "E741",
    # line too long
    "E501",
    # key in dict.keys()
    "SIM118",
    # memory leaks
    "B019",
    # No such file or directory
    "E902",
    # nested `if` statements
    "SIM102",
    # `if`-`else`-block
    "SIM108",
    # assign `lambda` expressions
    "E731",
    # Loop control variable overrides iterable it iterates
    "B020",
    # Return te negated condition directly
    "SIM103",
    # Function definition does not bind loop variable
    "B023",
]
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]


[tool.pytest.ini_options]
# Ignore deprecation warnings
filterwarnings = [
    "ignore::DeprecationWarning",
]
# Quiet output: dots while running, failures and errors in summary; importlib mode
# avoids __init__.py package-root walk.
addopts = "-q -rfE --tb=short --import-mode=importlib"
norecursedirs = ["test_helpers"]
pythonpath = ["tests", "tests/test_helpers", "benchmarks"]
# AMD/HIP test suite: rocm/ directory for all AMD-authored tests,
# plus explicit upstream test paths that are verified HIP-compatible.
# Running 'pytest' with no args runs exactly these tests.
testpaths = [
    "tests/rocm",
    "tests/attention/test_decode_prefill_lse.py",
    "tests/attention/test_non_contiguous_decode.py",
    "tests/attention/test_non_contiguous_prefill.py",
    "tests/attention/test_page.py",
    "tests/utils/test_activation.py",
    "tests/utils/test_quantization.py",
]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: heavy ROCm tests (1M-trial sampling frequency, 4GB-tensor speculative-sampling) — exclude with '-m \"not slow\"' for fast iteration; nightly runs include them.",
]

[tool.coverage.run]
branch = true
# Measure everything; scripts/amd_coverage.py attributes ownership at report
# time, so a new ROCm module cannot be missed by a list nobody refreshed.
# "." because coverage rejects a bare file in `source`, and build_backend_rocm.py
# ships the wheel.
source = ["."]
omit = [
    "tests/*",
    "benchmarks/*",
    "docs/*",
    "aot_build_utils/*",
    "flashinfer/_version.py",  # generated by setuptools-scm, gitignored
    "build_backend.py",  # upstream's, kept byte-identical and unused
]

[tool.coverage.paths]
# Folds the container mount points onto one root so a gfx942 run at /wt and a
# gfx950 run at /ws combine into one file, not two half-covered copies. Only
# takes effect when combine runs from a checkout holding the sources; see
# CONTRIBUTING.md. A pattern may not end in a wildcard.
source = [".", "/wt", "/ws", "*/site-packages"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
# The port re-indented upstream code under `if IS_CUDA:`, so git blames it on us
# even though no ROCm box can run it. Bare guards only -- a compound condition
# may still be reachable. `exclude_also` adds to coverage's defaults.
exclude_also = [
    "^\\s*if IS_CUDA:\\s*$",
    "^\\s*elif IS_CUDA:\\s*$",
]

[tool.coverage.html]
directory = "htmlcov"
