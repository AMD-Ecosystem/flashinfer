[build-system]
# NOTE: torch is intentionally NOT listed here because ROCm users must install
# torch from AMD's ROCm repository, not from PyPI. For example,
#   pip install torch==2.9.1 -f https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2/
# See README.md for complete installation instructions.
requires = ["setuptools>=80", "setuptools_scm>=8", "packaging>=24", "wheel", "ninja"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "amd-flashinfer-jit-cache"
dynamic = ["version"]
description = "Pre-compiled HIP kernels for FlashInfer on AMD ROCm"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "AMD ROCm Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime dependencies
# NOTE: torch is intentionally NOT listed here because ROCm users must install
# torch from AMD's ROCm repository, not from PyPI. For example,
#   pip install torch==2.9.1 -f https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2/
# See README.md for complete installation instructions.
dependencies = []

[project.urls]
Homepage = "https://github.com/ROCm/flashinfer"
Repository = "https://github.com/ROCm/flashinfer"

[tool.setuptools]
packages = ["amd_flashinfer_jit_cache"]
include-package-data = false

[tool.setuptools.package-data]
# The manifest must ship too: without it the consumer-side architecture check
# in jit/rocm/env.py sees no manifest, assumes a pre-check wheel, and trusts
# whatever it was given -- so a .so-only glob makes the guard a silent no-op.
amd_flashinfer_jit_cache = ["jit_cache/**/*.so", "jit_cache/aot_manifest.json"]

[tool.setuptools_scm]
root = ".."
write_to = "amd-flashinfer-jit-cache/amd_flashinfer_jit_cache/_version.py"
tag_regex = "^v?(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)(?:[+](?P<local>[a-zA-Z0-9.]+))?$"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
git_describe_command = ["python", "scripts/git_describe_rocm.py"]
fallback_version = "0.5.3"
